name: Deploy to Azure
 
on:
  push:
    branches: [ main ]
 
jobs:
  deploy:
    runs-on: ubuntu-latest
 
    steps:
      - uses: actions/checkout@v4

      # Write SSL certificate
      - name: Write SSL certificate
        working-directory: backend    
        run: |
          mkdir -p certs
          echo "${{ secrets.MYSQL_SSL }}" | base64 -d > certs/DigiCertGlobalRootG2.crt.pem
 
      # ---- Build the React frontend ----
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
 
      - name: Build frontend
        working-directory: frontend
        env:
          # Vite needs these at BUILD time (they get baked into the bundle).
          # Store them as GitHub repo secrets. They are public values, but
          # secrets keep the workflow file clean and environment-agnostic.
          VITE_AZURE_CLIENT_ID: ${{ secrets.VITE_AZURE_CLIENT_ID }}
          VITE_AZURE_TENANT_ID: ${{ secrets.VITE_AZURE_TENANT_ID }}
          VITE_API_SCOPE: ${{ secrets.VITE_API_SCOPE }}
        run: |
          npm ci
          npm run build          # outputs frontend/dist
 
      # ---- Fold the build into the backend's static dir ----
      - name: Copy frontend build into backend/static
        run: |
          rm -rf backend/static
          cp -r frontend/dist backend/static
 
      # ---- Prepare the Python deps so the Web App can run ----
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
 
      # Oryx (Azure's build system) can install requirements.txt on deploy,
      # but doing it here makes the deploy deterministic. We deploy only the
      # backend folder, which now contains main.py, requirements.txt, and static/.
 
      # ---- Deploy backend (with the built frontend inside) ----
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'document-request'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./backend